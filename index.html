<script>
// ── STAV (localStorage) ────────────────────────────────────────────────────
const DEFAULT_S = {
  name:"", workerUrl:"",
  sysPrompt:"Jsi finanční poradce. Odpovídáš stručně, věcně, v češtině. Nedáváš konkrétní investiční doporučení jako autoritativní radu, spíš fakta a kontext k rozhodnutí uživatele.",
  rates:{ USD: 23.5, EUR: 25.2 }, // záložní kurzy — použijí se, jen když se nepodaří stáhnout aktuální z ČNB
  liveRates:{} // { USD:{rate, date}, EUR:{rate, date} } — naposledy stažené kurzy z ČNB
};
let S = JSON.parse(localStorage.getItem("inv_s") || "null") || {...DEFAULT_S};
S = {...DEFAULT_S, ...S, rates:{...DEFAULT_S.rates, ...(S.rates||{})}, liveRates:{...(S.liveRates||{})}};

const DEFAULT_P = { positions: [], history: [] }; // history: [{date, invested, currentValue}] — denní snímky pro graf
let P = JSON.parse(localStorage.getItem("inv_p") || "null") || {...DEFAULT_P};
if(!Array.isArray(P.history)) P.history = [];

// META sleduje, KDY se naposledy změnila lokální data (ne obsah samotný) —
// slouží k rozhodnutí "kdo je novější" mezi tímto zařízením a cloudem.
let META = JSON.parse(localStorage.getItem("inv_meta") || "null") || { lastChange: null };
function saveMeta(){ localStorage.setItem("inv_meta", JSON.stringify(META)); }

let currentTab = "prehled";
let openPositionId = null; // když je nastaveno, portfolio tab zobrazuje detail pozice
let addPositionFormOpen = false; // sbalený/rozbalený formulář "Přidat pozici"
let addTxFormOpen = false; // sbalený/rozbalený formulář "Přidat transakci" v detailu pozice
let posShowCZK = false; // v detailu pozice: false = nativní měna (obchodovací), true = přepočet na CZK
let portfolioShowCZK = false; // v seznamu pozic (Portfolio tab): false = originální měna každé pozice, true = vše přepočtené na CZK
let collapsedGroups = {}; // { akcie: true, ... } — sbalené skupiny v Portfolio tabu
function toggleGroup(type){ collapsedGroups[type] = !collapsedGroups[type]; render(); }
let editingTxId = null; // pokud je nastaveno, formulář "Přidat transakci" edituje existující transakci místo přidání nové
let editPosMetaOpen = false; // sbalený/rozbalený formulář úpravy názvu/tickeru/ISIN u existující pozice
let autoSyncTimer = null;
let syncInFlight = false;

const TYPE_LABEL = { akcie:"Akcie", etf:"ETF", penzijni:"Penzijní spoření", krypto:"Kryptoměny", fond:"Investiční fond (OTC)" };
const TYPE_COLOR = { akcie:"#3b82f6", etf:"#06b6d4", penzijni:"#f59e0b", krypto:"#d946ef", fond:"#14b8a6" };

function saveSettingsRaw(){ localStorage.setItem("inv_s", JSON.stringify(S)); }
function savePortfolioRaw(){ localStorage.setItem("inv_p", JSON.stringify(P)); }
function markChanged(){
  META.lastChange = new Date().toISOString();
  saveMeta();
  scheduleAutoSync();
}
function saveSettings(){ saveSettingsRaw(); markChanged(); }
function savePortfolio(){ savePortfolioRaw(); markChanged(); }
function scheduleAutoSync(){
  clearTimeout(autoSyncTimer);
  autoSyncTimer = setTimeout(()=> syncToCloud(false), 1200); // debounce — počká, než dopíšeš, pak nahraje
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function fmtCZK(n){ return (Math.round(n)).toLocaleString("cs-CZ") + " Kč"; }
function fmtDateCZ(iso){ const [y,m,d] = iso.split("-"); return `${d}.${m}.${y}`; }
function fmtNum(n, d=2){ return Number(n).toLocaleString("cs-CZ", {minimumFractionDigits:0, maximumFractionDigits:d}); }
function fmtMoney(n, cur){ return cur==="CZK" ? fmtCZK(n) : Number(n).toLocaleString("cs-CZ",{minimumFractionDigits:2,maximumFractionDigits:2}) + " " + cur; }
function rateFor(cur){
  if(cur==="CZK") return 1;
  if(S.liveRates && S.liveRates[cur]) return S.liveRates[cur].rate;
  return S.rates[cur] || 1;
}

// ── VÝPOČTY NAD POZICÍ ──────────────────────────────────────────────────
// Transakce u akcie/etf/krypto: {id, date, qty, price, fee, fxRate, note}
//   qty záporné = prodej, price = cena za kus v nativní měně pozice, fee = poplatek (nativní měna)
//   fxRate = kurz CZK/nativní měna PLATNÝ K DATU TÉTO TRANSAKCE (dohledaný z ČNB nebo ručně)
// Transakce u penzijní: {id, date, qty, price:1, note} — qty = vklad(+)/výběr(-) v Kč přímo
function calcPosition(pos){
  const txs = pos.transactions || [];
  if(pos.type === "penzijni"){
    const invested = txs.reduce((s,t)=> s + t.qty, 0);
    const currentValue = pos.currentValue != null ? Number(pos.currentValue) : invested;
    return { qty:null, investedNative:invested, currentValueNative:currentValue,
      invested, currentValue, pnl: currentValue-invested,
      pnlPct: invested ? (currentValue-invested)/Math.abs(invested)*100 : 0,
      pnlNative: currentValue-invested, pnlPctNative: invested ? (currentValue-invested)/Math.abs(invested)*100 : 0 };
  }
  const qty = txs.reduce((s,t)=> s + t.qty, 0);
  // nativní: prostý součet (kolik jsi reálně zaplatil/dostal v měně, ve které se cenný papír obchoduje)
  const investedNative = txs.reduce((s,t)=> s + t.qty*t.price + (t.fee||0), 0);
  const currentPrice = pos.currentPrice != null ? Number(pos.currentPrice) : 0;
  const currentValueNative = qty * currentPrice;
  // CZK: každá transakce se přepočítává SVÝM VLASTNÍM kurzem k datu nákupu/prodeje —
  // ne jedním aktuálním kurzem, aby starší nákupy nebyly zkreslené dnešním kurzem.
  const investedCZK = pos.currency==="CZK" ? investedNative : txs.reduce((s,t)=>{
    const r = t.fxRate || rateFor(pos.currency);
    return s + (t.qty*t.price + (t.fee||0)) * r;
  }, 0);
  const liveRate = rateFor(pos.currency);
  const currentValueCZK = currentValueNative * liveRate;
  return {
    qty, investedNative, currentValueNative,
    invested: investedCZK, currentValue: currentValueCZK,
    pnl: currentValueCZK - investedCZK,
    pnlPct: investedCZK ? (currentValueCZK-investedCZK)/Math.abs(investedCZK)*100 : 0,
    pnlNative: currentValueNative - investedNative,
    pnlPctNative: investedNative ? (currentValueNative-investedNative)/Math.abs(investedNative)*100 : 0,
  };
}
function portfolioTotals(){
  let invested = 0, currentValue = 0;
  const byType = {};
  P.positions.forEach(pos=>{
    const c = calcPosition(pos);
    invested += c.invested;
    currentValue += c.currentValue;
    byType[pos.type] = (byType[pos.type]||0) + c.currentValue;
  });
  return { invested, currentValue, pnl: currentValue-invested, pnlPct: invested ? (currentValue-invested)/Math.abs(invested)*100 : 0, byType };
}

// ── HISTORIE HODNOTY PORTFOLIA (pro graf) ───────────────────────────────
// Appka si při každém otevření uloží jeden bod za den (invested + currentValue),
// pokud historii ještě NEBYLA sestavena zpětně tlačítkem "Sestavit historii ze
// zpětných dat" — to spočítá "vloženo" přesně z dat transakcí a "aktuální hodnotu"
// z historických cen (Twelve Data), takže graf jde vidět rovnou od první transakce.
function recordDailySnapshot(){
  if(P.positions.length===0) return; // nemá smysl ukládat prázdné portfolio
  const today = localISODate(new Date());
  const t = portfolioTotals();
  const existing = P.history.find(h=>h.date===today);
  if(existing){
    if(Math.round(existing.currentValue)!==Math.round(t.currentValue) || Math.round(existing.invested)!==Math.round(t.invested)){
      existing.currentValue = t.currentValue; existing.invested = t.invested;
      savePortfolio();
    }
  } else {
    P.history.push({ date: today, invested: t.invested, currentValue: t.currentValue });
    if(P.history.length>800) P.history = P.history.slice(-800); // pojistka proti neomezenému růstu
    savePortfolio();
  }
}
function firstTransactionDate(){
  let min = null;
  P.positions.forEach(pos=> (pos.transactions||[]).forEach(t=>{ if(!min || t.date<min) min = t.date; }));
  return min;
}
// Zpětně sestaví celou historii hodnoty portfolia:
// - "vloženo" = přesný součet transakcí ke každému dni (100% přesné, žádná externí data)
// - "aktuální hodnota" = držené kusy × historická cena k danému dni (Twelve Data), přepočtená
//   DNEŠNÍM kurzem napříč celou historií (zjednodušení — nemáme historické kurzy pro každý den,
//   jen k datům transakcí). U OTC fondů a pozic bez historických cen se použije poslední známá
//   cena zpětně (konzervativní odhad, ne skutečný historický vývoj).
async function reconstructHistory(){
  const firstDate = firstTransactionDate();
  if(!firstDate){ alert("Nejdřív přidej alespoň jednu transakci."); return; }
  const statusEl = document.getElementById("history-rebuild-status");
  const priceable = P.positions.filter(p=> p.type!=="penzijni" && p.type!=="fond" && p.ticker && (p.transactions||[]).length);
  const priceArrays = {}; // pos.id -> [[date, close], ...] seřazeno vzestupně

  for(let i=0;i<priceable.length;i++){
    const pos = priceable[i];
    if(statusEl) statusEl.textContent = `⏳ Stahuji historické ceny: ${pos.name} (${i+1}/${priceable.length})...`;
    if(!S.workerUrl) break;
    try{
      const res = await fetch(S.workerUrl, { method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ action:"price_history", symbol: pos.ticker, start: firstDate }) });
      const data = await res.json();
      if(data.prices && data.prices.length){
        priceArrays[pos.id] = data.prices.map(p=>[p.date, p.close]).sort((a,b)=> a[0]<b[0]?-1:1);
        pos.priceHistory = priceArrays[pos.id].map(([date,price])=>({date,price}));
      }
    }catch(e){ /* pozice bez historie ceny — použije se fallback níže */ }
  }

  if(statusEl) statusEl.textContent = `⏳ Sestavuji graf...`;

  // seřazené transakce a stavové ukazatele pro efektivní průchod dní vzestupně
  const posState = {};
  P.positions.forEach(pos=>{
    const txs = [...(pos.transactions||[])].sort((a,b)=> a.date<b.date?-1:1);
    posState[pos.id] = { txs, txIdx:0, qty:0, investedNative:0, investedCZK:0, priceArr: priceArrays[pos.id]||null, priceIdx:0, lastPrice:null };
  });

  const startD = new Date(firstDate+"T00:00:00Z");
  const endD = new Date(localISODate(new Date())+"T00:00:00Z");
  const newHistory = [];
  for(let d=new Date(startD); d<=endD; d.setUTCDate(d.getUTCDate()+1)){
    const dateStr = localISODate(d);
    let invested = 0, currentValue = 0;
    P.positions.forEach(pos=>{
      const st = posState[pos.id];
      if(pos.type==="penzijni"){
        while(st.txIdx<st.txs.length && st.txs[st.txIdx].date<=dateStr){ st.investedCZK += st.txs[st.txIdx].qty; st.txIdx++; }
        invested += st.investedCZK;
        currentValue += st.investedCZK; // bez historie hodnoty fondu — konzervativně = vklady
        return;
      }
      while(st.txIdx<st.txs.length && st.txs[st.txIdx].date<=dateStr){
        const t = st.txs[st.txIdx];
        st.qty += t.qty;
        st.investedNative += t.qty*t.price + (t.fee||0);
        const r = t.fxRate || rateFor(pos.currency);
        st.investedCZK += (t.qty*t.price + (t.fee||0)) * r;
        st.txIdx++;
      }
      invested += st.investedCZK;
      if(st.qty>0){
        if(st.priceArr){
          while(st.priceIdx<st.priceArr.length && st.priceArr[st.priceIdx][0]<=dateStr){ st.lastPrice = st.priceArr[st.priceIdx][1]; st.priceIdx++; }
        }
        const price = st.lastPrice!=null ? st.lastPrice : (pos.currentPrice!=null ? pos.currentPrice : 0);
        const rate = rateFor(pos.currency);
        currentValue += st.qty * price * rate;
      }
    });
    newHistory.push({ date: dateStr, invested, currentValue });
  }

  P.history = newHistory;
  savePortfolio();
  render();
  const statusEl2 = document.getElementById("history-rebuild-status");
  if(statusEl2) statusEl2.textContent = `✅ Historie sestavena od ${firstDate} (${newHistory.length} dní) · ${new Date().toLocaleTimeString("cs-CZ",{hour:'2-digit',minute:'2-digit'})}`;
}
let chartRange = 'max'; // vybrané období grafu: 7d/1m/6m/ytd/1y/5y/10y/max
function setChartRange(r){ chartRange = r; render(); }
function rangeCutoffDateStr(){
  if(chartRange==='max') return null;
  const now = new Date();
  let cutoff;
  if(chartRange==='7d'){ cutoff=new Date(now); cutoff.setDate(cutoff.getDate()-7); }
  else if(chartRange==='1m'){ cutoff=new Date(now); cutoff.setMonth(cutoff.getMonth()-1); }
  else if(chartRange==='6m'){ cutoff=new Date(now); cutoff.setMonth(cutoff.getMonth()-6); }
  else if(chartRange==='ytd'){ cutoff=new Date(now.getFullYear(),0,1); }
  else if(chartRange==='1y'){ cutoff=new Date(now); cutoff.setFullYear(cutoff.getFullYear()-1); }
  else if(chartRange==='5y'){ cutoff=new Date(now); cutoff.setFullYear(cutoff.getFullYear()-5); }
  else if(chartRange==='10y'){ cutoff=new Date(now); cutoff.setFullYear(cutoff.getFullYear()-10); }
  else return null;
  return localISODate(cutoff);
}
function filterHistoryByRange(hist){
  const cutoffStr = rangeCutoffDateStr();
  if(!cutoffStr || hist.length===0) return hist;
  return hist.filter(h=>h.date>=cutoffStr);
}
function filterSeriesByRange(series){
  const cutoffStr = rangeCutoffDateStr();
  if(!cutoffStr || series.length===0) return series;
  return series.filter(s=>s.date>=cutoffStr);
}
const CHART_GRANULARITY = { '7d':'day', '1m':'day', '6m':'month', 'ytd':'month', '1y':'month', '5y':'year', '10y':'year', 'max':'year' };
// Sestaví popisky osy X podle zvolené granularity: dny (DD.MM.) / měsíce (MM.YYYY) / roky (YYYY)
function buildXAxisTicks(minD, maxD, granularity){
  const DAY = 86400000;
  const ticks = [];
  if(granularity === 'day'){
    const totalDays = Math.max(1, Math.round((maxD-minD)/DAY));
    const step = Math.max(1, Math.ceil(totalDays/5));
    for(let d=0; d<=totalDays; d+=step){
      const t = minD + d*DAY;
      const dt = new Date(t);
      ticks.push({ t, label: `${String(dt.getUTCDate()).padStart(2,'0')}.${String(dt.getUTCMonth()+1).padStart(2,'0')}.` });
    }
  } else if(granularity === 'month'){
    let cur = new Date(minD); cur = new Date(Date.UTC(cur.getUTCFullYear(), cur.getUTCMonth(), 1));
    const months = [];
    while(cur.getTime() <= maxD){ months.push(new Date(cur)); cur = new Date(Date.UTC(cur.getUTCFullYear(), cur.getUTCMonth()+1, 1)); }
    if(months.length===0) months.push(new Date(minD));
    const step = Math.max(1, Math.ceil(months.length/6));
    for(let i=0;i<months.length;i+=step){
      const m = months[i];
      ticks.push({ t: Math.max(m.getTime(), minD), label: `${String(m.getUTCMonth()+1).padStart(2,'0')}.${m.getUTCFullYear()}` });
    }
  } else { // year
    const startY = new Date(minD).getUTCFullYear(), endY = new Date(maxD).getUTCFullYear();
    for(let y=startY; y<=endY; y++){
      const t = Math.max(Date.UTC(y,0,1), minD);
      ticks.push({ t, label: String(y) });
    }
  }
  return ticks;
}
// "Hezká" čísla pro osu Y (jako u běžných investičních appek — kulaté kroky, ne min/max náhodně)
function niceNum(range, round){
  if(range<=0) return 1;
  const exponent = Math.floor(Math.log10(range));
  const fraction = range / Math.pow(10, exponent);
  let niceFraction;
  if(round){
    if(fraction<1.5) niceFraction=1;
    else if(fraction<3) niceFraction=2;
    else if(fraction<7) niceFraction=5;
    else niceFraction=10;
  } else {
    if(fraction<=1) niceFraction=1;
    else if(fraction<=2) niceFraction=2;
    else if(fraction<=5) niceFraction=5;
    else niceFraction=10;
  }
  return niceFraction * Math.pow(10, exponent);
}
function niceTicks(min, max, maxTicks){
  if(min===max){ min-=1; max+=1; }
  const range = niceNum(max-min, false);
  const step = niceNum(range/(maxTicks-1), true);
  const niceMin = Math.floor(min/step)*step;
  const niceMax = Math.ceil(max/step)*step;
  const ticks = [];
  for(let v=niceMin; v<=niceMax+1e-9; v+=step) ticks.push(Math.round(v));
  return { ticks, niceMin, niceMax };
}
function buildHistoryChartHTML(){

function chartHover(evt, svgEl){
  if(!evt) return;
  const pts = JSON.parse(svgEl.getAttribute('data-points'));
  if(!pts || !pts.length) return;
  const rect = svgEl.getBoundingClientRect();
  const vb = svgEl.viewBox.baseVal;
  const relX = (evt.clientX - rect.left) / rect.width * vb.width;
  let nearest = pts[0], minDist = Infinity;
  for(const p of pts){ const d = Math.abs(p.x-relX); if(d<minDist){ minDist=d; nearest=p; } }
  const dot = svgEl.querySelector('.chart-dot');
  const guide = svgEl.querySelector('.chart-guide');
  if(dot){ dot.setAttribute('cx', nearest.x); dot.setAttribute('cy', nearest.y); dot.style.display='block'; }
  if(guide){ guide.setAttribute('x1', nearest.x); guide.setAttribute('x2', nearest.x); guide.style.display='block'; }
  const tip = svgEl.parentElement.querySelector('.chart-tooltip');
  if(tip){
    const mode = svgEl.getAttribute('data-mode') || 'pair';
    const cur = svgEl.getAttribute('data-cur') || 'CZK';
    if(mode === 'single'){
      tip.innerHTML = `<b>${fmtDateCZ(nearest.date)}</b><br>${fmtMoney(nearest.v, cur)}`;
    } else {
      const diff = nearest.v - nearest.inv;
      const diffPct = nearest.inv ? (diff/Math.abs(nearest.inv)*100) : 0;
      tip.innerHTML = `<b>${fmtDateCZ(nearest.date)}</b><br>${fmtCZK(nearest.v)}<br><span style="color:${diff>=0?'#22c55e':'#ef4444'}">${diff>=0?'+':''}${fmtCZK(diff)} (${diffPct.toFixed(1)}%)</span>`;
    }
    tip.style.display='block';
    const leftPct = (nearest.x/vb.width*100);
    tip.style.left = Math.min(Math.max(leftPct,8),68) + '%';
  }
}
function chartHoverEnd(svgEl){
  const dot = svgEl.querySelector('.chart-dot');
  const guide = svgEl.querySelector('.chart-guide');
  if(dot) dot.style.display='none';
  if(guide) guide.style.display='none';
  const tip = svgEl.parentElement.querySelector('.chart-tooltip');
  if(tip) tip.style.display='none';
}

function portfolioByCurrency(){
  const byCur = {};
  P.positions.forEach(pos=>{
    const c = calcPosition(pos);
    const cur = pos.currency;
    const val = pos.type==="penzijni" ? c.currentValue : c.currentValueNative;
    byCur[cur] = (byCur[cur]||0) + val;
  });
  return byCur;
}
function buildAllocationPieHTML(byType, total){
  const entries = Object.entries(byType).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]);
  if(entries.length===0 || total<=0) return '<div class="empty-hint">Žádná data k zobrazení.</div>';
  const R=70, CX=90, CY=90;
  let cumAngle = -90;
  const paths = entries.map(([type,val],i)=>{
    const pct = val/total;
    const angle = pct*360;
    const startAngle = cumAngle, endAngle = cumAngle+angle;
    cumAngle = endAngle;
    const largeArc = angle>180 ? 1 : 0;
    const startRad = startAngle*Math.PI/180, endRad = endAngle*Math.PI/180;
    const x1 = CX + R*Math.cos(startRad), y1 = CY + R*Math.sin(startRad);
    const x2 = CX + R*Math.cos(endRad), y2 = CY + R*Math.sin(endRad);
    // celý koláč (jediná kategorie, 100%) potřebuje kruh místo výseče, jinak by cesta zdegenerovala
    const d = entries.length===1
      ? `M${CX-R},${CY} A${R},${R} 0 1 1 ${CX+R},${CY} A${R},${R} 0 1 1 ${CX-R},${CY} Z`
      : `M${CX},${CY} L${x1.toFixed(2)},${y1.toFixed(2)} A${R},${R} 0 ${largeArc} 1 ${x2.toFixed(2)},${y2.toFixed(2)} Z`;
    return `<path d="${d}" fill="${TYPE_COLOR[type]}" stroke="#111827" stroke-width="2" style="cursor:pointer" data-label="${TYPE_LABEL[type]}" data-value="${fmtCZK(val)}" data-pct="${(pct*100).toFixed(1)}" onclick="pieSliceTap(this)" onmouseenter="pieSliceTap(this)"></path>`;
  }).join("");
  const legend = entries.map(([type,val])=>{
    const pct = total ? (val/total*100) : 0;
    return `<div class="row" style="margin-top:6px;font-size:12px">
      <span><span class="type-badge type-${type}">${TYPE_LABEL[type]}</span></span>
      <span style="color:#94a3b8">${fmtCZK(val)} · ${pct.toFixed(1)}%</span>
    </div>`;
  }).join("");
  return `<div style="position:relative;max-width:220px;margin:0 auto">
    <svg viewBox="0 0 180 180" style="width:100%;height:auto;display:block">
      ${paths}
      <circle cx="90" cy="90" r="40" fill="#111827"></circle>
    </svg>
    <div id="pie-tooltip" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;font-size:11px;color:#94a3b8;line-height:1.4">Klepni na<br>výseč</div>
  </div>
  ${legend}`;
}
function pieSliceTap(el){
  const svg = el.closest('svg');
  svg.querySelectorAll('path').forEach(p=> p.setAttribute('stroke-width','2'));
  el.setAttribute('stroke-width','4');
  const tip = document.getElementById('pie-tooltip');
  if(tip) tip.innerHTML = `<b>${el.dataset.label}</b><br>${el.dataset.value}<br>${el.dataset.pct}%`;
}

async function refreshAllPrices(){
  if(!S.workerUrl){ alert("Nejdřív nastav Worker URL v Adminu."); return; }
  const statusEl = document.getElementById("prices-refresh-status");
  const updatable = P.positions.filter(p => p.type!=="penzijni" && ((p.type==="fond" && p.isin) || (p.type!=="fond" && p.ticker)));
  if(updatable.length===0){ if(statusEl) statusEl.textContent = "Žádné pozice s tickerem (akcie/ETF/krypto) nebo ISIN (OTC fond) k aktualizaci."; return; }
  let ok=0, fail=0;
  for(let i=0;i<updatable.length;i++){
    const pos = updatable[i];
    if(statusEl) statusEl.textContent = `⏳ Aktualizuji ${pos.name}... (${i+1}/${updatable.length})`;
    try{
      let res, data;
      if(pos.type === "fond"){
        res = await fetch(S.workerUrl, { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({ action:"price_fund_atlantik", isin: pos.isin }) });
      } else {
        res = await fetch(S.workerUrl, { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({ action:"price_stock", symbol: pos.ticker }) });
      }
      data = await res.json();
      if(data.price){
        pos.currentPrice = data.price;
        pos.currentPriceDate = data.date || localISODate(new Date());
        pos.currentPriceSource = data.source || (pos.type==="fond" ? "atlantik.cz" : null);
        ok++;
      } else fail++;
    }catch(e){ fail++; }
  }
  savePortfolio();
  render();
  const statusEl2 = document.getElementById("prices-refresh-status");
  if(statusEl2) statusEl2.textContent = `✅ Aktualizováno: ${ok} · Nepodařilo se: ${fail} (${new Date().toLocaleTimeString("cs-CZ",{hour:'2-digit',minute:'2-digit'})})`;
}

// ── ČNB DEVIZOVÉ KURZY (přes Worker — ČNB API nemá CORS pro přímé volání z prohlížeče) ──
async function fetchTxFxRate(posId){
  const pos = P.positions.find(p=>p.id===posId); if(!pos || pos.currency === "CZK") return;
  if(!S.workerUrl) return;
  const dateEl = document.getElementById("tx-date");
  const fxEl = document.getElementById("tx-fxrate");
  const statusEl = document.getElementById("tx-fxrate-status");
  if(!dateEl || !fxEl) return;
  const date = dateEl.value;
  if(!date) return;
  if(statusEl) statusEl.textContent = "⏳ zjišťuji kurz z ČNB...";
  try{
    const res = await fetch(S.workerUrl, {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ action:"fx_rate", currency: pos.currency, date })
    });
    const data = await res.json();
    if(data.rate){
      fxEl.value = data.rate.toFixed(4);
      statusEl && (statusEl.textContent = data.date===date
        ? `✅ ČNB kurz k ${data.date}`
        : `✅ ČNB kurz k ${data.date} (nejbližší předchozí obchodní den)`);
    } else {
      statusEl && (statusEl.textContent = "⚠️ Kurz se nepodařilo dohledat, zadej ručně.");
    }
  }catch(e){
    statusEl && (statusEl.textContent = "⚠️ Offline nebo chyba Workeru — zadej kurz ručně.");
  }
}
async function refreshLiveRate(cur){
  if(cur==="CZK" || !S.workerUrl) return;
  try{
    const today = localISODate(new Date());
    const res = await fetch(S.workerUrl, {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ action:"fx_rate", currency: cur, date: today })
    });
    const data = await res.json();
    if(data.rate){
      S.liveRates[cur] = { rate: data.rate, date: data.date };
      saveSettings();
      render();
    }
  }catch(e){ /* tiše ignorovat, použije se záložní kurz */ }
}

function addOrUpdateTx(id){
  const pos = P.positions.find(p=>p.id===id); if(!pos) return;
  const date = document.getElementById("tx-date").value || localISODate(new Date());
  const note = document.getElementById("tx-note").value.trim();
  let txData;
  if(pos.type === "penzijni"){
    const amount = parseFloat(document.getElementById("tx-amount").value);
    if(isNaN(amount) || amount===0){ alert("Zadej platnou částku."); return; }
    txData = { date, qty: amount, price: 1, note };
  } else {
    const kind = document.getElementById("tx-kind").value;
    let qty = parseFloat(document.getElementById("tx-qty").value);
    const price = parseFloat(document.getElementById("tx-price").value);
    const feeEl = document.getElementById("tx-fee");
    const fee = feeEl ? (parseFloat(feeEl.value) || 0) : 0;
    if(isNaN(qty) || qty<=0 || isNaN(price) || price<=0){ alert("Zadej platný počet kusů a cenu."); return; }
    if(kind==="sell") qty = -qty;
    let fxRate = null;
    if(pos.currency !== "CZK"){
      const fxEl = document.getElementById("tx-fxrate");
      const v = fxEl ? parseFloat(fxEl.value) : NaN;
      if(!isNaN(v) && v>0) fxRate = v;
    }
    txData = { date, qty, price, fee, fxRate, note };
  }
  if(editingTxId){
    const idx = pos.transactions.findIndex(t=>t.id===editingTxId);
    if(idx>=0) pos.transactions[idx] = { ...pos.transactions[idx], ...txData };
    editingTxId = null;
  } else {
    pos.transactions.push({ id: uid(), ...txData });
  }
  savePortfolio(); render();
}
function editTx(posId, txId){
  editingTxId = txId;
  addTxFormOpen = true;
  render();
}
function cancelEditTx(){
  editingTxId = null;
  addTxFormOpen = false;
  render();
}
function deleteTx(posId, txId){
  if(!confirm("Opravdu smazat tuto transakci?")) return;
  const pos = P.positions.find(p=>p.id===posId); if(!pos) return;
  pos.transactions = pos.transactions.filter(t=>t.id!==txId);
  if(editingTxId===txId) editingTxId = null;
  savePortfolio(); render();
}

function portfolioSummaryForAI(){

async function askAI(){

  const rb = document.getElementById("ai-response");

  try{
    const contextBlock = P.positions.length ? `\n\nKontext aktuálního portfolia uživatele:\n${portfolioSummaryForAI()}` : "";
    const res = await fetch(S.workerUrl, {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ system: S.sysPrompt + contextBlock, messages:[{role:"user", content:q}] })
    });
    const data = await res.json();
    const text = data.content?.[0]?.text || (data.error ? `❌ Chyba: ${data.error.message||data.error}` : "Prázdná odpověď.");
    if(rb) rb.innerHTML = `<div class="card" style="background:#0a1628;margin:0"><div style="white-space:pre-wrap;font-size:13px;line-height:1.6">${text}</div></div>`;
  }catch(e){
    if(rb) rb.innerHTML = `<div style="color:#ef4444;font-size:12px">❌ ${e.message}</div>`;
  }
}

    <input id="s-name" value="${S.name}">
    <div class="field-label">Cloudflare Worker URL (AI + cloud sync)</div>
    <input id="s-worker" value="${S.workerUrl}" placeholder="https://tvuj-worker.workers.dev">
    <div class="field-label">AI systémový prompt</div>
    <textarea id="s-prompt" rows="2">${S.sysPrompt}</textarea>
    <button class="btn" onclick="saveAdminForm()" style="width:100%;margin-top:10px;background:#166534">💾 Uložit</button>
    <button class="btn" onclick="syncFromCloud()" style="width:100%;margin-top:8px;background:#334155">🔄 Sync z cloudu</button>
    <button class="btn" onclick="syncToCloud(true)" style="width:100%;margin-top:8px;background:#334155">☁️ Sync do cloudu</button>
    <div id="sync-info" style="font-size:11px;color:#64748b;margin-top:8px"></div>
  </div>
  <div class="card">
    <div class="card-title">Devizové kurzy</div>
    <div class="card-sub">Živé kurzy se stahují z ČNB (zdarma, bez klíče). Ruční hodnoty níže se použijí jen jako záloha, kdyby se stažení nepovedlo (offline apod.).</div>
    <div class="row" style="margin-top:8px">
      <div class="pos-meta">USD: <b>${fmtNum(rateFor("USD"),3)}</b> Kč ${S.liveRates.USD ? `<span style="color:#22c55e">· ČNB ${S.liveRates.USD.date}</span>` : `<span style="color:#f59e0b">· záložní ruční</span>`}</div>
    </div>
    <div class="row">
      <div class="pos-meta">EUR: <b>${fmtNum(rateFor("EUR"),3)}</b> Kč ${S.liveRates.EUR ? `<span style="color:#22c55e">· ČNB ${S.liveRates.EUR.date}</span>` : `<span style="color:#f59e0b">· záložní ruční</span>`}</div>
    </div>
    <button class="btn" onclick="refreshLiveRate('USD');refreshLiveRate('EUR')" style="width:100%;margin-top:10px;background:#1e40af">🔄 Aktualizovat kurzy z ČNB</button>
    <div class="field-label" style="margin-top:12px">Záložní kurz — 1 USD = ? CZK</div>
    <input id="s-usd" type="number" step="0.01" value="${S.rates.USD}">
    <div class="field-label">Záložní kurz — 1 EUR = ? CZK</div>
    <input id="s-eur" type="number" step="0.01" value="${S.rates.EUR}">
    <button class="btn" onclick="saveRates()" style="width:100%;margin-top:10px;background:#166534">💾 Uložit záložní kurzy</button>
  </div>`;
}
function saveAdminForm(){
  S.name = document.getElementById("s-name").value;
  S.workerUrl = document.getElementById("s-worker").value.trim();
  S.sysPrompt = document.getElementById("s-prompt").value;
  saveSettings();
  document.getElementById("hdr-name").textContent = S.name || "Investiční Dashboard";
  alert("Uloženo.");
}
function saveRates(){
  const usd = parseFloat(document.getElementById("s-usd").value);
  const eur = parseFloat(document.getElementById("s-eur").value);
  if(!isNaN(usd)) S.rates.USD = usd;
  if(!isNaN(eur)) S.rates.EUR = eur;
  saveSettings();
  alert("Kurzy uloženy.");
}

// ── CLOUD SYNC (KV přes Worker) ─────────────────────────────────────────
// Auto-upload: po každé změně (viz markChanged/scheduleAutoSync) se stav potichu
// nahraje do cloudu. Auto-download: při startu appky (viz initSync) se stáhne
// poslední cloudová verze, ALE jen pokud je novější než lokální data — jinak
// bychom mobilem přepsali čerstvě zadané věci z počítače a naopak.
function updateHeaderSub(status){
  const el = document.getElementById("hdr-sub");
  if(el) el.textContent = status;
}
async function syncToCloud(manual){
  if(!S.workerUrl) { if(manual) alert("Nejdřív nastav Worker URL."); return; }
  const el = document.getElementById("sync-info");
  if(manual && el) el.textContent = "⏳ Nahrávám do cloudu...";
  if(syncInFlight) return;
  syncInFlight = true;
  try{
    const ts = META.lastChange || new Date().toISOString();
    await fetch(S.workerUrl, {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ action:"kv_set", key:"invest_sync", value:{ settings:S, portfolio:P, ts } })
    });
    if(manual && el) el.textContent = "✅ Nahráno do cloudu · " + new Date().toLocaleString("cs-CZ");
    updateHeaderSub("☁️ Synchronizováno · " + new Date().toLocaleTimeString("cs-CZ", {hour:'2-digit', minute:'2-digit'}));
  }catch(e){
    if(manual && el) el.textContent = "❌ " + e.message;
    updateHeaderSub("⚠️ Sync se nepovedl (offline?)");
  }finally{
    syncInFlight = false;
  }
}
async function syncFromCloud(manual=true){
  const el = document.getElementById("sync-info");
  if(!S.workerUrl){ if(manual && el) el.textContent = "Nastav nejdřív Worker URL."; return; }
  if(manual && el) el.textContent = "⏳ Synchronizuji...";
  try{
    const res = await fetch(S.workerUrl, {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ action:"kv_get", key:"invest_sync" })
    });
    const data = await res.json();
    const remote = data.value;
    if(remote?.settings || remote?.portfolio){
      if(remote.settings) S = {...S, ...remote.settings, rates:{...S.rates, ...(remote.settings.rates||{})}};
      if(remote.portfolio) P = remote.portfolio;
      saveSettingsRaw(); savePortfolioRaw();
      META.lastChange = remote.ts; saveMeta();
      render(); // překreslí Admin tab — VŽDY před zápisem hlášky, jinak se hláška smaže spolu se starým DOM
      document.getElementById("hdr-name").textContent = S.name || "Investiční Dashboard";
      updateHeaderSub("☁️ Staženo z cloudu · " + new Date(remote.ts).toLocaleTimeString("cs-CZ", {hour:'2-digit', minute:'2-digit'}));
      if(manual){ const freshEl = document.getElementById("sync-info"); if(freshEl) freshEl.textContent = "✅ Sync OK · " + new Date(remote.ts).toLocaleString("cs-CZ"); }
      return true;
    }else{
      if(manual && el) el.textContent = "☁️ V cloudu zatím nic není.";
      return false;
    }
  }catch(e){
    if(manual && el) el.textContent = "❌ " + e.message;
    updateHeaderSub("⚠️ Sync se nepovedl (offline?)");
    return false;
  }
}

// Zavolá se při startu appky. Porovná čas poslední lokální změny s časem
// dat v cloudu a použije to novější — buď stáhne, nebo naopak nahraje.
async function initSync(){
  if(!S.workerUrl) return; // bez Worker URL sync nedává smysl, appka funguje jen lokálně
  try{
    const res = await fetch(S.workerUrl, {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ action:"kv_get", key:"invest_sync" })
    });
    const data = await res.json();
    const remote = data.value;
    const localTs = META.lastChange ? new Date(META.lastChange).getTime() : 0;
    const remoteTs = remote?.ts ? new Date(remote.ts).getTime() : 0;

    if(remoteTs > localTs){
      if(remote.settings) S = {...S, ...remote.settings, rates:{...S.rates, ...(remote.settings.rates||{})}};
      if(remote.portfolio) P = remote.portfolio;
      saveSettingsRaw(); savePortfolioRaw();
      META.lastChange = remote.ts; saveMeta();
      document.getElementById("hdr-name").textContent = S.name || "Investiční Dashboard";
      render();
      updateHeaderSub("☁️ Staženo z cloudu · " + new Date(remote.ts).toLocaleTimeString("cs-CZ", {hour:'2-digit', minute:'2-digit'}));
    } else if(localTs > remoteTs){
      await syncToCloud(false);
    } else if(remoteTs){
      updateHeaderSub("☁️ Synchronizováno");
    }
  }catch(e){
    updateHeaderSub("⚠️ Offline — pracuji jen s lokálními daty");
  }
}

// ── PWA REGISTRACE ──────────────────────────────────────────────────────
if("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  });
}

// ── START ────────────────────────────────────────────────────────────────
document.getElementById("hdr-name").textContent = S.name || "Investiční Dashboard";
showTab("prehled"); // okamžité vykreslení z lokálních dat, ať appka nečeká na síť
initSync(); // na pozadí zkontroluje/stáhne/nahraje cloud a případně překreslí
</script>
</body>
</html>
